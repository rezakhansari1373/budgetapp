services:
  - type: web
    name: budgetapp
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    healthCheckPath: /login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "budgetapp.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://budgetapp.onrender.com"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: budgetdb
          property: connectionString

databases:
  - name: budgetdb
    plan: free
