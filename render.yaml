services:
  - type: web
    name: budgetapp
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "budgetapp.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://budgetapp.onrender.com"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: budgetdb
          property: connectionString

  - type: cron
    name: generate-recurring
    runtime: python
    plan: free
    schedule: "0 0 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py generate_recurring"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: budgetdb
          property: connectionString
      - key: SECRET_KEY
        sync: false

databases:
  - name: budgetdb
    plan: free
